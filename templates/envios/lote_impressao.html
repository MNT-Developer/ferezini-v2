<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Ferezini — lote {{ lote.pk }}</title>
    {% include "relatorios/_estilo_obra_impressao.html" %}
    <style>
      @page {
        @bottom-left {
          content: "Confirmação: {{ lote.data_envio|date:'d/m/Y H:i' }}";
          text-align: left;
          font-size: 9pt;
          color: #666;
        }

        @bottom-right {
          text-align: right;
        }
      }

      .envio-itens col:nth-child(1) {
        width: 16%;
      }

      .envio-itens col:nth-child(2) {
        width: 18%;
      }

      .envio-itens col:nth-child(3) {
        width: 27%;
      }

      .envio-itens col:nth-child(4) {
        width: 14%;
      }

      .envio-itens col:nth-child(5),
      .envio-itens col:nth-child(6) {
        width: 8%;
      }

      .envio-itens col:nth-child(7) {
        width: 9%;
      }

      .envio-itens td:nth-child(4),
      .envio-itens td:nth-child(6) {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <strong class="marca">FEREZINI</strong><span>Gestão Financeira de Obras · Relatório de envio</span>
    </header>
    {% include "envios/_resumo_lote.html" with impressao=True valor_relatorio=lote.valor_total %}
    {% include "envios/_itens_lote.html" %}
  </body>
</html>
