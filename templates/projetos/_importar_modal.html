<dialog id="import-project-dialog"
        class="app-dialog"
        aria-labelledby="import-project-title"
        aria-describedby="import-project-description">
  <form method="post" action="{% url 'projetos:importar' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <h2 id="import-project-title">
      Importar projeto
    </h2>
    <p class="muted" id="import-project-description">
      Selecione a planilha com as abas Painel, Serviços e Custos e Projeto. Os envios históricos serão criados por data, sem taxa adicional.
    </p>
    <div class="field">
      <label for="import-project-file">
        Arquivo Excel
      </label>
      <input id="import-project-file"
             type="file"
             name="arquivo"
             required
             accept=".xlsx,.xls,.xlsm"
             aria-describedby="import-project-help"
             autofocus>
      <small class="field-help" id="import-project-help">Formatos: .xlsm, .xlsx e .xls. Até 20 MB. Macros não são executadas.</small>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" type="button" data-close-import>
        Fechar
      </button>
      <button class="btn btn-primary" type="submit">
        Importar
      </button>
    </div>
  </form>
</dialog>
